
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
    .done 
    {
    text-decoration: line-through;
    color: gray;
    }
</style>
</head>
<body>
    <input id="task" placeholder="Enter Your task...">
    <button id="add">ADD</button>
    <ul id="list">

    </ul>
<script>
    $(function(){
        function loadtasks()
        {
            $.getJSON("fetch.php",function(data){
                let html="";
                $.each(data,function(i,task){
                    console.log(data);
                    html += `<li data-id="${task.id}">
                            <span class="${task.status==1?'done':''}">${task.task}</span>
                            <button class="complete">Complete</button>
                            <button class="del">DEL</button></li>`;
                });
                $("#list").html(html);
            });
        }
        loadtasks();
        $("#add").click(function(){
            $.post("insert.php",{task:$("#task").val()},loadtasks);
            $("#task").val("");
        });
        $("#list").on("click",".del",function(){
            let id=$(this).parent().data("id");
            $.post("delete.php",{id},loadtasks)
        });
        $("#list").on("click",".complete",function(){
            let id=$(this).parent().data("id");
            $.post("update.php",{id},loadtasks)
        });
    });

</script>
</body>
</html>
